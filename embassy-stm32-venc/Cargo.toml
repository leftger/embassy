[package]
name = "embassy-stm32-venc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Embassy driver for the STM32N6 Video Encoder (Hantro H.264 + JPEG encoder)."
keywords = ["embedded", "stm32", "h264", "jpeg", "encoder"]
categories = ["embedded", "hardware-support", "no-std"]
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-stm32-venc"
readme = "README.md"

publish = false

[package.metadata.embassy]
build = [
    { target = "thumbv8m.main-none-eabihf", features = ["stm32n657x0"] },
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-stm32-venc-v$VERSION/embassy-stm32-venc/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-stm32-venc/src/"
target = "thumbv8m.main-none-eabihf"
features = ["stm32n657x0"]

[package.metadata.docs.rs]
features = ["stm32n657x0"]

[dependencies]
embassy-stm32 = { version = "0.6.0", path = "../embassy-stm32", features = ["unstable-pac"] }
embassy-hal-internal = { version = "0.5.0", path = "../embassy-hal-internal" }
embassy-time = { version = "0.5.1", path = "../embassy-time" }

# Raw Hantro encoder bindings + the prebuilt `libvenc` archive. The `venc-m55`
# preset enables the module and links the Cortex-M55 library in one step.
#
# NOTE: this points at the crate generated by the `stm32-bindings` repo
# (`./d build-venc && ./d gen`, output under `build/stm32-bindings`). Once the
# `venc` module is published, this becomes a plain
# `stm32-bindings = { version = "0.4.0", optional = true, default-features = false }`
# dependency, matching `embassy-stm32-neochrom`.
stm32-bindings = { path = "../../stm32-bindings/build/stm32-bindings", optional = true, default-features = false }

critical-section = "1.2"

defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.17", optional = true }

[dev-dependencies]
# The examples/ link test needs a time driver for `EWLWaitHwRdy`'s timeout.
embassy-stm32 = { version = "0.6.0", path = "../embassy-stm32", features = ["unstable-pac", "time-driver-any"] }

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = "0.7"

[features]
default = []

## Implement `defmt::Format` for the public types.
defmt = ["dep:defmt", "embassy-hal-internal/defmt"]
## Forward log messages through the `log` crate.
log = ["dep:log"]

## Chip families
n6 = []

## Enable the VENC bindings and link `libvenc` (Cortex-M55, hard-float).
venc = ["dep:stm32-bindings", "stm32-bindings/venc-m55"]

stm32n657x0 = ["embassy-stm32/stm32n657x0", "venc", "n6"]
stm32n655x0 = ["embassy-stm32/stm32n655x0", "venc", "n6"]
stm32n647x0 = ["embassy-stm32/stm32n647x0", "venc", "n6"]
stm32n645x0 = ["embassy-stm32/stm32n645x0", "venc", "n6"]
